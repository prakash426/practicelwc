<template>
  <lightning-card title="Convert Lead" icon-name="standard:lead">
    <template lwc:if={hasError}>
      <c-error-panel errors={error}></c-error-panel>
    </template>
    <div class="slds-p-around_small">
      <template lwc:if={leadName}>
        <p class="slds-m-bottom_small">
          Convert <strong>{leadName}</strong>
          <template lwc:if={company}> from {company}</template>
          into an Account and Contact.
        </p>
      </template>
      <lightning-button
        label="Convert Lead"
        variant="brand"
        onclick={handleConvert}
        disabled={isBusy}
      ></lightning-button>
      <template lwc:if={isBusy}>
        <lightning-spinner alternative-text="Converting" size="small"></lightning-spinner>
      </template>
    </div>
  </lightning-card>
</template>
