<template>
    <lightning-card title="Quote to Approval" icon-name="standard:flow">
        <div class="slds-p-horizontal_medium">
            <lightning-record-edit-form record-id={recordId} object-api-name="Opportunity" onsuccess={handleSaved} onerror={handleFormError}>
                <lightning-messages></lightning-messages>
                <lightning-input-field field-name="Name"></lightning-input-field>
                <lightning-input-field field-name="Amount"></lightning-input-field>
                <lightning-input-field field-name="Discount_Percent__c"></lightning-input-field>
                <div class="slds-m-top_small">
                    <lightning-button type="submit" label="Save Quote Fields" variant="neutral"></lightning-button>
                </div>
            </lightning-record-edit-form>
            <div class="slds-m-top_medium slds-box">
                <p class="slds-m-bottom_small">Discount math preview (client-side, no server call): <strong>{previewTotal}</strong></p>
                <lightning-button label="Send to Approval Flow" variant="brand" onclick={handleLaunchFlow} icon-name="utility:flow"></lightning-button>
            </div>
            <template if:true={error}><p class="slds-text-color_error slds-m-top_small" role="alert">{error}</p></template>
        </div>
    </lightning-card>
</template>
