<template>
  <lightning-card title="Create a Case" icon-name="standard:case">
    <template lwc:if={createdId}>
      <div class="slds-p-around_small">
        <p class="slds-m-bottom_small success">Case created. Attach files, then review it below.</p>
        <lightning-file-upload
          label="Attach files"
          record-id={createdId}
          onuploadfinished={handleUploadFinished}
          multiple
        ></lightning-file-upload>
        <div class="slds-m-top_small">
          <lightning-record-form
            record-id={createdId}
            object-api-name="Case"
            layout-type="Compact"
            mode="view"
          ></lightning-record-form>
        </div>
        <lightning-button label="Open Case" variant="brand" onclick={handleOpen} class="slds-m-top_small"></lightning-button>
      </div>
    </template>
    <template lwc:else>
      <div class="slds-p-around_small">
        <template lwc:if={prefilledTerm}>
          <p class="slds-m-bottom_small hint">Prefilled from your search: "{prefilledTerm}"</p>
        </template>
        <lightning-input label="Subject" value={subject} onchange={handleSubject} required></lightning-input>
        <lightning-textarea label="Description" value={description} onchange={handleDescription}></lightning-textarea>
        <lightning-combobox
          label="Priority"
          value={priority}
          options={priorityOptions}
          onchange={handlePriority}
          class="slds-m-top_small"
        ></lightning-combobox>
        <template lwc:if={error}>
          <c-error-panel errors={error} class="slds-m-top_small"></c-error-panel>
        </template>
        <lightning-button
          label="Submit Case"
          variant="brand"
          onclick={handleSubmit}
          disabled={isBusy}
          class="slds-m-top_small"
        ></lightning-button>
      </div>
    </template>
  </lightning-card>
</template>
