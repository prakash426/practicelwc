<template>
  <lightning-card title="CPQ Lite: Guided Selling" icon-name="standard:quotes">
    <div class="slds-p-around_medium">
      <lightning-progress-indicator current-step={currentStep} type="path" variant="base">
        <lightning-progress-step label="Bundle" value="bundle"></lightning-progress-step>
        <lightning-progress-step label="Configure" value="configure"></lightning-progress-step>
        <lightning-progress-step label="Price" value="price"></lightning-progress-step>
        <lightning-progress-step label="Approve" value="approve"></lightning-progress-step>
      </lightning-progress-indicator>
      <template lwc:if={isBundle}>
        <lightning-combobox label="Price Book" value={pricebookId} options={pricebookOptions} onchange={handlePricebook}></lightning-combobox>
        <lightning-combobox label="Currency" value={currencyIso} options={currencyOptions} onchange={handleCurrency}></lightning-combobox>
        <lightning-tree-grid columns={bundleColumns} data={bundles} key-field="id" onrowselection={handleBundleSelect}></lightning-tree-grid>
      </template>
      <template lwc:if={isConfigure}>
        <c-cpq-line-editor lines={lines} onlineschange={handleLinesChange}>
          <span slot="header">Line Items</span>
        </c-cpq-line-editor>
      </template>
      <template lwc:if={isPrice}>
        <lightning-datatable columns={priceColumns} data={pricedLines} key-field="id" hide-checkbox-column></lightning-datatable>
        <p class="slds-text-heading_medium slds-m-top_small">Total: {formattedTotal}</p>
        <template lwc:if={blockedMsg}><p class="slds-text-color_error">{blockedMsg}</p></template>
      </template>
      <template lwc:if={isApprove}>
        <lightning-button label="Send for Approval" variant="brand" onclick={handleApproval} disabled={approvalBlocked}></lightning-button>
      </template>
      <div class="slds-m-top_medium slds-grid slds-grid_align-spread">
        <lightning-button label="Back" onclick={goBack} disabled={isFirst}></lightning-button>
        <lightning-button label="Next" variant="brand" onclick={goNext} disabled={isLast}></lightning-button>
      </div>
    </div>
  </lightning-card>
</template>
