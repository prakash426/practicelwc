<template>
    <section role="dialog" aria-modal="true" aria-label={title} class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <header class="slds-modal__header"><h2 class="slds-text-heading_medium">{title}</h2></header>
            <div class="slds-modal__content slds-p-around_medium">
                <lightning-textarea label="Comments" value={comments} onchange={handleComments} required={isReject} field-level-help="Required when rejecting"></lightning-textarea>
                <template if:true={error}><p class="slds-text-color_error slds-m-top_small">{errorMessage}</p></template>
            </div>
            <footer class="slds-modal__footer">
                <lightning-button label="Cancel" onclick={handleCancel}></lightning-button>
                <lightning-button label={title} variant="brand" onclick={handleConfirm} disabled={isLoading} class="slds-m-left_small"></lightning-button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
