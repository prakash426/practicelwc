<template>
  <lightning-card title="Case to Resolution" icon-name="standard:case">
    <div class="slds-p-horizontal_medium">
      <lightning-button label="Refresh thread" onclick={refresh}></lightning-button>
      <template for:each={events} for:item="e"><p key={e.caseId}>{e.stage}: {e.caseId}</p></template>
    </div>
  </lightning-card>
</template>
