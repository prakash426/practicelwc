<template>
  <lightning-card title="Lead to Cash" icon-name="standard:opportunity">
    <div class="slds-p-horizontal_medium">
      <lightning-progress-indicator current-step={stage}>
        <lightning-progress-step label="Worklist" value="worklist"></lightning-progress-step>
        <lightning-progress-step label="Quote" value="quote"></lightning-progress-step>
        <lightning-progress-step label="Approval" value="approval"></lightning-progress-step>
        <lightning-progress-step label="PDF" value="pdf"></lightning-progress-step>
      </lightning-progress-indicator>
      <lightning-button label="Launch approval flow" onclick={launchApproval} variant="brand"></lightning-button>
    </div>
  </lightning-card>
</template>
