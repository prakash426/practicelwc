<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" role="img" aria-label="Demo GIF placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3f2f2"/>
      <stop offset="1" stop-color="#e5e5e5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" rx="16" fill="url(#bg)" stroke="#c9c9c9" stroke-dasharray="10 6" stroke-width="2"/>
  <g font-family="Salesforce Sans, Arial, sans-serif" text-anchor="middle">
    <text x="400" y="92" font-size="30" fill="#706e6b">Demo GIF coming soon</text>
    <text x="400" y="126" font-size="16" fill="#969492">Record on a scratch org, save as images/demo/&lt;level&gt;.gif</text>
  </g>
  <circle cx="120" cy="100" r="14" fill="#0b5cab">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="100" r="14" fill="#0b5cab">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
