<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="PracticeLWC hero: 35 projects across 4 levels">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#032d60">
        <animate attributeName="stop-color" values="#032d60;#0b5cab;#032d60" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#0b5cab">
        <animate attributeName="stop-color" values="#0b5cab;#1b9aaa;#0b5cab" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff362"/>
      <stop offset="1" stop-color="#ffb75d"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#sky)"/>

  <g opacity="0.25" fill="#ffffff">
    <circle cx="150" cy="70" r="60" filter="url(#soft)">
      <animate attributeName="cx" values="150;210;150" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="260" r="80" filter="url(#soft)">
      <animate attributeName="cx" values="1050;990;1050" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="40" r="40" filter="url(#soft)">
      <animate attributeName="cy" values="40;70;40" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g opacity="0.9">
    <rect x="120" y="150" width="90" height="110" rx="10" fill="#ffffff" opacity="0.14">
      <animate attributeName="y" values="150;138;150" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="230" y="110" width="90" height="150" rx="10" fill="#ffffff" opacity="0.20">
      <animate attributeName="y" values="110;96;110" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="340" y="70" width="90" height="190" rx="10" fill="#ffffff" opacity="0.26">
      <animate attributeName="y" values="70;58;70" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="450" y="40" width="90" height="220" rx="10" fill="#ffffff" opacity="0.32">
      <animate attributeName="y" values="40;30;40" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(600,60)">
    <path d="M70 10 L20 120 L58 120 L44 190 L110 80 L70 80 Z" fill="url(#bolt)">
      <animate attributeName="opacity" values="1;0.75;1" dur="4s" repeatCount="indefinite"/>
    </path>
    <text x="130" y="80" font-family="Salesforce Sans, Arial, sans-serif" font-size="64" font-weight="bold" fill="#ffffff">PracticeLWC</text>
    <text x="132" y="120" font-family="Salesforce Sans, Arial, sans-serif" font-size="24" fill="#d8e6f3">35 projects. 4 levels. Zero to architect.</text>
    <g font-family="Salesforce Sans, Arial, sans-serif" font-size="20" font-weight="bold">
      <rect x="132" y="145" width="150" height="40" rx="20" fill="#2e844a"/>
      <text x="207" y="172" text-anchor="middle" fill="#fff">Beginner</text>
      <rect x="292" y="145" width="170" height="40" rx="20" fill="#0b5cab"/>
      <text x="377" y="172" text-anchor="middle" fill="#fff">Intermediate</text>
      <rect x="132" y="193" width="150" height="40" rx="20" fill="#8a3392"/>
      <text x="207" y="220" text-anchor="middle" fill="#fff">Advanced</text>
      <rect x="292" y="193" width="170" height="40" rx="20" fill="#dd7a01"/>
      <text x="377" y="220" text-anchor="middle" fill="#fff">Capstone</text>
    </g>
  </g>
</svg>
